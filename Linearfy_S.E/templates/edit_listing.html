{% extends "base.html" %}
{% block content %}<div class="page-header hidden"><div class="header-content"><h1>Edit listing</h1><p>Keep product details and available stock accurate.</p></div></div><div class="refined-wrapper hidden"><div class="refined-container seller-form"><form action="{{ url_for('edit_listing', product_id=product.id) }}" method="POST" enctype="multipart/form-data" class="refined-form"><div class="input-group"><label>Product name</label><input name="name" value="{{ product.name }}" minlength="3" maxlength="100" required></div><div class="input-grid"><div class="input-group"><label>Price (NZD)</label><input name="price" type="number" value="{{ '%.2f'|format(product.price) }}" min="0.01" max="10000" step="0.01" required></div><div class="input-group"><label>Available stock</label><input name="stock_count" type="number" value="{{ product.stock_count }}" min="0" max="{{ max_stock }}" required></div></div><div class="input-group"><label>Category</label><select name="category" class="custom-select">{% for category in categories %}<option value="{{ category }}" {% if product.category == category %}selected{% endif %}>{{ category|title }}</option>{% endfor %}</select></div><div class="input-group"><label>Replace image (optional)</label><input name="image" type="file" accept=".png,.jpg,.jpeg,.webp"></div><div class="input-group"><label>Description</label><textarea name="description" minlength="20" maxlength="2000" required>{{ product.description }}</textarea></div><button class="btn btn-primary" type="submit">Save changes</button><a href="{{ url_for('account') }}" class="btn btn-outline full-width">Cancel</a></form></div></div>{% endblock %}

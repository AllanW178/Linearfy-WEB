{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div class="header-content">
        <h1>Edit Details</h1>
        <p>Update your personal information below.</p>
    </div>
</div>

<div class="auth-wrapper original-wrapper">
    <div class="original-container">
        
        <form action="{{ url_for('edit_account') }}" method="POST" class="original-form">
            
            <div class="input-row original-row">
                <input type="text" name="first_name" value="{{ user.first_name }}" required class="original-input-short">
                <input type="text" name="last_name" value="{{ user.last_name }}" required class="original-input-short">
            </div>
            
            <label class="original-label">Date of Birth</label>
            <input type="date" name="dob" value="{{ user.dob.strftime('%Y-%m-%d') }}" required class="original-input-full">
            
            <label class="original-label">Email Address</label>
            <input type="email" name="email" value="{{ user.email }}" required class="original-input-full">
            
            <hr class="original-hr">
            
            <label class="original-label">Change Password (Leave blank to keep current password)</label>
            <input type="password" name="new_password" placeholder="New Password" class="original-input-full">
            
            <div class="original-btn-group">
                <a href="{{ url_for('account') }}" class="btn original-btn-cancel">Cancel</a>
                <button type="submit" class="btn original-btn-submit">Save Changes</button>
            </div>

        </form>

    </div>
</div>
{% endblock %}

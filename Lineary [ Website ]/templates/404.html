{% extends "base.html" %}

{% block content %}
<div class="error-container">
    
    <h1 class="error-title">
        Hmm, this page is lost somewhere...
    </h1>
    
    <h2 class="error-subtitle">
        Page Not Found
    </h2>
    
    <p class="error-text">
        We couldn't find the page you're looking for. It might have been moved, deleted, or perhaps it never existed in our catalog. Let's go back to the center, shall we?
    </p>
    
    <a href="{{ url_for('home') }}" class="btn btn-return">
        Return to Homepage
    </a>

</div>
{% endblock %}
